; Capture button firmware (board b43, ESP32-C6-WROOM-1-N8)
;
; Framework: ESP-IDF (not Arduino), via the pioarduino platform.
; The official platformio/espressif32 platform lags on C6 / IDF 5.x;
; pioarduino 55.03.31 bundles ESP-IDF 5.5.1.
;
; Chip config lives in sdkconfig.defaults (plain text, edit directly).
; PlatformIO generates sdkconfig.button from it on first build; delete
; sdkconfig.button after editing the defaults so it gets regenerated.

[env:button]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = espidf
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
extra_scripts = tools/audio_flash.py
; Audio partition on Upload (uses the same port as the firmware):
;   keep   = leave it alone (fast)    upload = also write audio/test_audio.bin
;   erase  = also blank it (no clip at power-up)
; Set to upload once to get the clip on a board, then back to keep.
custom_audio = keep
monitor_speed = 115200
; USB Serial/JTAG resets the chip on RTS (as esptool uses it): opening the monitor with the
; lines asserted rebooted it, and the port it had disappeared. Leave both released.
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
